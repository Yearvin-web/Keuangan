<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catatan Keuangan</title>
<meta name="theme-color" content="#F8FAFC">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Keuangan">
<script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#F8FAFC;--card:#fff;--ink:#0F172A;--mute:#64748B;--line:#E2E8F0;--in:#0D9488;--out:#4F46E5;--neg:#E11D48;--grad:linear-gradient(135deg,#6366F1,#06B6D4);--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px}
body{min-height:100dvh;padding-top:env(safe-area-inset-top)}
[hidden]{display:none!important}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
/* login */
#login{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px;text-align:center;background:radial-gradient(circle at 20% 10%,#E0E7FF 0,transparent 45%),radial-gradient(circle at 90% 80%,#CFFAFE 0,transparent 45%),var(--bg)}
#login h1{font-size:24px;margin:14px 0 4px}
#login p{color:var(--mute);margin-bottom:22px}
.logo{width:64px;height:64px;border-radius:20px;background:var(--grad);display:grid;place-items:center;color:#fff;font-size:34px;font-weight:300}
.pin{width:100%;max-width:280px;text-align:center;letter-spacing:.5em;font-size:26px;padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff;outline:none}
.pin:focus,.fld:focus{border-color:#6366F1;box-shadow:0 0 0 3px #6366F126}
.err{color:var(--neg);font-size:13px;min-height:18px;margin-top:8px}
.btn{display:block;width:100%;padding:14px;border-radius:14px;background:var(--grad);color:#fff;font-weight:600}
.btn:disabled{opacity:.6}
.btn.ghost{background:#EEF2FF;color:#4338CA}
.btn.danger{background:var(--neg)}
/* header */
header{display:flex;align-items:center;justify-content:space-between;padding:14px 0 8px}
header h1{font-size:20px}
header small{color:var(--mute);display:block;font-size:12px}
.ib{width:40px;height:40px;border-radius:12px;background:#fff;border:1px solid var(--line);display:inline-grid;place-items:center;margin-left:6px}
.spin{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
/* period */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 14px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:14px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.custom{display:flex;gap:8px;margin-bottom:10px}
.fld{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:none;min-width:0}
/* main */
main{padding-bottom:120px}
.glass{background:linear-gradient(135deg,#6366F1ee,#06B6D4ee);color:#fff;border-radius:22px;padding:20px;box-shadow:0 12px 30px #6366F133;position:relative;overflow:hidden}
.glass::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,#ffffff40,transparent 55%);pointer-events:none}
.glass .lbl{opacity:.85;font-size:13px}
.glass .big{font-size:30px;font-weight:700;margin-top:4px;letter-spacing:-.5px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card .lbl{color:var(--mute);font-size:13px}
.card .val{font-size:18px;font-weight:700;margin-top:4px}
.glass-s{background:#ffffffb0;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.in{color:var(--in)}.out{color:var(--out)}.neg{color:var(--neg)}
h2{font-size:16px;margin:18px 0 10px}
.chart{height:230px;position:relative}
.sk{background:linear-gradient(90deg,#E2E8F0,#F1F5F9,#E2E8F0);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:14px}
@keyframes sh{to{background-position:-200% 0}}
.empty{text-align:center;color:var(--mute);padding:36px 12px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
/* list */
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 10px}
.filters .full{grid-column:1/-1}
.tx{display:flex;gap:12px;align-items:center;padding:12px;background:#fff;border:1px solid var(--line);border-radius:16px;margin-bottom:8px}
.dot{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:700;flex:none}
.dot.i{background:#CCFBF1;color:var(--in)}.dot.o{background:#E0E7FF;color:var(--out)}
.tx .m{flex:1;min-width:0}
.tx .m b{display:block}
.tx .m span{color:var(--mute);font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .a{text-align:right;font-weight:700;white-space:nowrap}
.tx .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:4px;font-size:12.5px}
.tx .acts button{color:var(--mute);padding:2px 0}
.tx .acts .del{color:var(--neg)}
.more{margin-top:6px}
/* insight */
.ins{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px}
.ins .e{font-size:22px}
.ins p{color:var(--mute);font-size:13px;margin-top:2px}
.ins h3{font-size:15px}
.bar{height:8px;background:#EEF2FF;border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--grad);border-radius:99px}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:#ffffffd9;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:10}
nav .in-nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1fr 1.5fr;gap:4px;align-items:center}
nav button.t{padding:8px 2px;font-size:12px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button.t.on{color:#4338CA;font-weight:600}
nav button.t svg{width:22px;height:22px}
nav .fab{background:var(--grad);color:#fff;border-radius:16px;padding:14px 10px;font-weight:700;box-shadow:0 8px 20px #6366F14d}
/* sheet & modal */
.ov{position:fixed;inset:0;background:#0F172A80;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:94dvh;overflow-y:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h2{margin:0 0 12px;text-align:center}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#F1F5F9;border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{padding:11px;border-radius:11px;font-weight:600;color:var(--mute)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px #0001}
.seg button.on.i{color:var(--in)}.seg button.on.o{color:var(--out)}
.amt{font-size:30px;font-weight:700;text-align:center;padding:14px}
.lab{font-size:13px;color:var(--mute);margin:12px 0 6px;display:block}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.cats .chip.on{background:var(--grad);border-color:transparent}
.fe{color:var(--neg);font-size:12.5px;margin-top:4px;min-height:16px}
.modal{align-items:center;padding:20px}
.modal .sheet{border-radius:22px;max-width:360px;text-align:center;animation:none}
.modal p{color:var(--mute);margin:6px 0 16px}
.modal .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:420px}
.toast{padding:12px 16px;border-radius:14px;color:#fff;font-size:14px;box-shadow:0 8px 24px #0003;animation:up .2s}
.toast.ok{background:#0F766E}.toast.bad{background:var(--neg)}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>

<section id="login" hidden>
  <div class="logo">+</div>
  <h1>Catatan Keuangan</h1>
  <p>Masukkan PIN untuk membuka</p>
  <input id="pin" class="pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="8" placeholder="••••••">
  <div class="err" id="pinErr"></div>
  <button class="btn" id="pinBtn" style="max-width:280px;margin-top:8px">Buka</button>
</section>

<div id="app" hidden>
  <div class="wrap">
    <header>
      <div><h1 id="ttl">Ringkasan</h1><small id="sub"></small></div>
      <div>
        <button class="ib" id="refresh" aria-label="Muat ulang"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
        <button class="ib" id="logout" aria-label="Keluar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg></button>
      </div>
    </header>

    <div id="periodBar">
      <div class="chips" id="chips"></div>
      <div class="custom" id="custom" hidden>
        <input type="date" class="fld" id="cFrom" aria-label="Dari tanggal">
        <input type="date" class="fld" id="cTo" aria-label="Sampai tanggal">
      </div>
    </div>

    <main>
      <section id="v-dash"></section>
      <section id="v-hist" hidden></section>
      <section id="v-ins" hidden></section>
    </main>
  </div>

  <nav><div class="in-nav">
    <button class="t on" data-nav="dash"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>Dashboard</button>
    <button class="t" data-nav="hist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Riwayat</button>
    <button class="t" data-nav="ins"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2z"/></svg>Insight</button>
    <button class="fab" id="addBtn">+ Tambah</button>
  </div></nav>
</div>

<div class="ov" id="formOv" hidden>
  <div class="sheet" role="dialog" aria-modal="true">
    <h2 id="formTtl">Tambah transaksi</h2>
    <div class="seg" id="seg">
      <button data-j="Pengeluaran" class="o">Pengeluaran</button>
      <button data-j="Pemasukan" class="i">Pemasukan</button>
    </div>
    <input id="amt" class="fld amt" inputmode="numeric" autocomplete="off" placeholder="0" aria-label="Nominal">
    <div class="fe" id="eAmt"></div>
    <span class="lab">Kategori</span>
    <div class="cats" id="cats"></div>
    <div class="fe" id="eCat"></div>
    <span class="lab">Tanggal</span>
    <input type="date" id="dt" class="fld">
    <div class="fe" id="eDt"></div>
    <span class="lab">Catatan (opsional)</span>
    <input id="note" class="fld" maxlength="200" placeholder="Misal: makan siang">
    <div style="height:16px"></div>
    <button class="btn" id="saveBtn">Simpan</button>
    <button class="btn ghost" id="cancelBtn" style="margin-top:8px">Batal</button>
  </div>
</div>

<div class="ov modal" id="delOv" hidden>
  <div class="sheet" role="alertdialog" aria-modal="true">
    <h2>Hapus transaksi?</h2>
    <p id="delTxt"></p>
    <div class="two">
      <button class="btn ghost" id="delNo">Batal</button>
      <button class="btn danger" id="delYes">Hapus</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
'use strict';
const API_URL = 'GANTI_DENGAN_URL_WEB_APP_KAMU';
const TZ = 'Asia/Jakarta';
const KAT = {
  Pemasukan: ['Gaji', 'Bonus', 'Lainnya'],
  Pengeluaran: ['Makan', 'Transport', 'Tagihan', 'Belanja', 'Hiburan', 'Kesehatan', 'Lainnya']
};
const BLN = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const PAL = ['#6366F1','#06B6D4','#14B8A6','#F59E0B','#EC4899','#8B5CF6','#64748B','#22C55E','#F97316'];
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const S = { token: localStorage.getItem('tk') || '', data: [], loaded: false, busy: false, view: 'dash', period: 'bulan', cFrom: '', cTo: '', limit: 50, f: { q: '', jenis: '', kat: '', from: '', to: '' } };
let F = null, delItem = null, charts = {};

/* ---------- util ---------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rp = n => (n < 0 ? '-' : '') + 'Rp ' + Math.abs(Math.round(n)).toLocaleString('id-ID');
const todayStr = () => new Date().toLocaleDateString('sv-SE', { timeZone: TZ });
const U = s => new Date(s + 'T00:00:00Z');
const addDays = (s, n) => { const d = U(s); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const diffDays = (a, b) => Math.round((U(b) - U(a)) / 864e5);
const dow = s => (U(s).getUTCDay() + 6) % 7;
const monthStart = s => s.slice(0, 8) + '01';
const monthEnd = s => { const d = U(s.slice(0, 7) + '-01'); d.setUTCMonth(d.getUTCMonth() + 1, 0); return d.toISOString().slice(0, 10); };
const prevMonthStart = s => { const d = U(s.slice(0, 7) + '-01'); d.setUTCMonth(d.getUTCMonth() - 1); return d.toISOString().slice(0, 10); };
const fmtDate = s => { const [y, m, d] = s.split('-'); return `${+d} ${BLN[+m - 1]} ${y}`; };
const minS = (a, b) => (a < b ? a : b);
const sumBy = (list, j) => list.filter(t => t.jenis === j).reduce((a, t) => a + t.nominal, 0);

function catKey(k) {
  const t = String(k).trim();
  const all = [...KAT.Pemasukan, ...KAT.Pengeluaran];
  return all.find(c => c.toLowerCase() === t.toLowerCase()) || (t ? t.charAt(0).toUpperCase() + t.slice(1) : 'Tanpa kategori');
}

function toast(msg, ok = true) {
  const el = document.createElement('div');
  el.className = 'toast ' + (ok ? 'ok' : 'bad');
  el.textContent = msg;
  $('#toast').appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

/* ---------- API ---------- */
async function api(action, payload = {}) {
  try {
    const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, token: S.token, ...payload }) });
    const j = await res.json();
    if (j.auth) { showLogin('Sesi berakhir. Masukkan PIN lagi.'); }
    return j;
  } catch (e) {
    return { ok: false, error: 'Tidak bisa terhubung. Periksa internet kamu.' };
  }
}

function setData(arr) {
  S.data = arr;
  S.loaded = true;
  try { localStorage.setItem('cache', JSON.stringify(arr)); } catch (e) {}
  renderAll();
}

async function load(manual) {
  if (S.busy) return;
  S.busy = true;
  $('#refresh svg').classList.add('spin');
  const r = await api('list');
  S.busy = false;
  $('#refresh svg').classList.remove('spin');
  if (r.ok) { setData(r.data); if (manual) toast('Data diperbarui'); }
  else if (!r.auth) { toast(r.error, false); if (!S.loaded) { S.loaded = true; renderAll(); } }
}

/* ---------- login ---------- */
function showLogin(msg) {
  S.token = ''; localStorage.removeItem('tk');
  $('#app').hidden = true; $('#login').hidden = false;
  $('#pinErr').textContent = msg || '';
  $('#pin').value = '';
}

async function doLogin() {
  const pin = $('#pin').value.trim();
  if (!pin) { $('#pinErr').textContent = 'PIN wajib diisi.'; return; }
  $('#pinBtn').disabled = true; $('#pinBtn').textContent = 'Memeriksa...';
  const r = await api('login', { pin });
  $('#pinBtn').disabled = false; $('#pinBtn').textContent = 'Buka';
  if (!r.ok) { $('#pinErr').textContent = r.error; $('#pin').value = ''; return; }
  S.token = r.token; localStorage.setItem('tk', r.token);
  enterApp();
}

function enterApp() {
  $('#login').hidden = true; $('#app').hidden = false;
  try { const c = JSON.parse(localStorage.getItem('cache') || 'null'); if (c) { S.data = c; S.loaded = true; } } catch (e) {}
  renderAll();
  load();
}

/* ---------- periode ---------- */
function range() {
  const t = todayStr();
  if (S.period === 'hari') return [t, t];
  if (S.period === 'minggu') { const a = addDays(t, -dow(t)); return [a, addDays(a, 6)]; }
  if (S.period === 'bulan') return [monthStart(t), monthEnd(t)];
  const a = S.cFrom || t, b = S.cTo || t;
  return a <= b ? [a, b] : [b, a];
}
function elapsed([a, b]) { return Math.max(1, diffDays(a, minS(b, todayStr())) + 1); }
function prevRange([a, b]) {
  const el = elapsed([a, b]);
  if (S.period === 'bulan') { const ps = prevMonthStart(a); return [ps, minS(monthEnd(ps), addDays(ps, el - 1))]; }
  const len = diffDays(a, b) + 1;
  return [addDays(a, -len), addDays(a, -len + el - 1)];
}
const inRange = (list, [a, b]) => list.filter(t => t.tanggal >= a && t.tanggal <= b);

function renderPeriod() {
  const opts = [['hari', 'Hari Ini'], ['minggu', 'Minggu Ini'], ['bulan', 'Bulan Ini'], ['custom', 'Kustom']];
  $('#chips').innerHTML = opts.map(([k, l]) => `<button class="chip ${S.period === k ? 'on' : ''}" data-p="${k}">${l}</button>`).join('');
  $('#custom').hidden = S.period !== 'custom';
  const [a, b] = range();
  $('#sub').textContent = a === b ? fmtDate(a) : `${fmtDate(a)} - ${fmtDate(b)}`;
}

/* ---------- render ---------- */
function renderAll() {
  const titles = { dash: 'Ringkasan', hist: 'Riwayat', ins: 'Insight' };
  $('#ttl').textContent = titles[S.view];
  $$('[data-nav]').forEach(b => b.classList.toggle('on', b.dataset.nav === S.view));
  ['dash', 'hist', 'ins'].forEach(v => $('#v-' + v).hidden = v !== S.view);
  $('#periodBar').hidden = S.view === 'hist';
  if (S.view === 'hist') $('#sub').textContent = S.loaded ? `${S.data.length} transaksi` : '';
  else renderPeriod();
  if (S.view === 'dash') renderDash();
  if (S.view === 'hist') renderHist();
  if (S.view === 'ins') renderIns();
}

const skeleton = '<div class="sk" style="height:110px"></div><div class="row2"><div class="sk" style="height:76px"></div><div class="sk" style="height:76px"></div></div><div class="sk" style="height:230px"></div>';
const emptyHtml = (t, s) => `<div class="empty"><b>${t}</b>${s}</div>`;

function killCharts() { Object.values(charts).forEach(c => c.destroy()); charts = {}; }

function renderDash() {
  const el = $('#v-dash');
  killCharts();
  if (!S.loaded) { el.innerHTML = skeleton; return; }
  const r = range(), list = inRange(S.data, r);
  const inc = sumBy(list, 'Pemasukan'), exp = sumBy(list, 'Pengeluaran'), net = inc - exp;
  let html = `
    <div class="glass"><div class="lbl">Saldo bersih</div><div class="big">${rp(net)}</div></div>
    <div class="row2">
      <div class="card glass-s"><div class="lbl">Pemasukan</div><div class="val in">${rp(inc)}</div></div>
      <div class="card glass-s"><div class="lbl">Pengeluaran</div><div class="val out">${rp(exp)}</div></div>
    </div>`;
  if (!list.length) {
    html += emptyHtml('Belum ada transaksi di periode ini', 'Ketuk "+ Tambah" untuk mencatat yang pertama.');
    el.innerHTML = html; return;
  }
  html += `<h2>Pengeluaran per kategori</h2><div class="card"><div class="chart"><canvas id="cDonut"></canvas></div></div>
           <h2>Arus kas</h2><div class="card"><div class="chart"><canvas id="cBar"></canvas></div></div>`;
  el.innerHTML = html;
  drawCharts(list, r);
}

function drawCharts(list, r) {
  if (typeof Chart === 'undefined') { setTimeout(() => S.view === 'dash' && renderDash(), 600); return; }
  Chart.defaults.font.family = 'system-ui,sans-serif';
  const byCat = {};
  list.filter(t => t.jenis === 'Pengeluaran').forEach(t => { const k = catKey(t.kategori); byCat[k] = (byCat[k] || 0) + t.nominal; });
  const cats = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
  if (cats.length) {
    charts.d = new Chart($('#cDonut'), {
      type: 'doughnut',
      data: { labels: cats.map(c => c[0]), datasets: [{ data: cats.map(c => c[1]), backgroundColor: cats.map((_, i) => PAL[i % PAL.length]), borderWidth: 2, borderColor: '#fff' }] },
      options: { maintainAspectRatio: false, cutout: '62%', plugins: { legend: { position: 'right', labels: { boxWidth: 10, usePointStyle: true } }, tooltip: { callbacks: { label: c => ` ${c.label}: ${rp(c.parsed)}` } } } }
    });
  } else { $('#cDonut').parentElement.innerHTML = emptyHtml('Tidak ada pengeluaran', ''); }
  const end = minS(r[1], todayStr());
  const monthly = diffDays(r[0], end) > 31;
  const keys = [];
  if (monthly) {
    let d = r[0].slice(0, 7);
    while (d <= end.slice(0, 7)) { keys.push(d); const x = U(d + '-01'); x.setUTCMonth(x.getUTCMonth() + 1); d = x.toISOString().slice(0, 7); }
  } else { for (let d = r[0]; d <= end; d = addDays(d, 1)) keys.push(d); }
  const kOf = t => (monthly ? t.tanggal.slice(0, 7) : t.tanggal);
  const mk = j => keys.map(k => list.filter(t => t.jenis === j && kOf(t) === k).reduce((a, t) => a + t.nominal, 0));
  const lab = k => { const p = k.split('-'); return monthly ? `${BLN[+p[1] - 1]} ${p[0].slice(2)}` : `${+p[2]}/${+p[1]}`; };
  charts.b = new Chart($('#cBar'), {
    type: 'bar',
    data: { labels: keys.map(lab), datasets: [{ label: 'Pemasukan', data: mk('Pemasukan'), backgroundColor: '#14B8A6', borderRadius: 5 }, { label: 'Pengeluaran', data: mk('Pengeluaran'), backgroundColor: '#6366F1', borderRadius: 5 }] },
    options: { maintainAspectRatio: false, plugins: { legend: { labels: { boxWidth: 10, usePointStyle: true } }, tooltip: { callbacks: { label: c => ` ${c.dataset.label}: ${rp(c.parsed.y)}` } } }, scales: { y: { ticks: { callback: v => v >= 1e6 ? v / 1e6 + 'jt' : v >= 1e3 ? v / 1e3 + 'rb' : v } }, x: { grid: { display: false } } } }
  });
}

/* ---------- riwayat ---------- */
function filtered() {
  const f = S.f, q = f.q.trim().toLowerCase();
  return S.data.map((t, i) => ({ t, i })).filter(({ t }) =>
    (!f.jenis || t.jenis === f.jenis) &&
    (!f.kat || catKey(t.kategori) === f.kat) &&
    (!f.from || t.tanggal >= f.from) && (!f.to || t.tanggal <= f.to) &&
    (!q || (t.kategori + ' ' + t.catatan + ' ' + t.nominal).toLowerCase().includes(q))
  ).sort((a, b) => b.t.tanggal.localeCompare(a.t.tanggal) || b.i - a.i).map(x => x.t);
}

function renderHist() {
  const el = $('#v-hist');
  if (!S.loaded) { el.innerHTML = '<div class="sk" style="height:48px;margin-bottom:10px"></div>' + '<div class="sk" style="height:64px;margin-bottom:8px"></div>'.repeat(5); return; }
  if (!el.querySelector('#fq')) {
    const allCats = [...new Set([...KAT.Pemasukan, ...KAT.Pengeluaran, ...S.data.map(t => catKey(t.kategori))])].sort();
    el.innerHTML = `<div class="filters">
      <input class="fld full" id="fq" type="search" placeholder="Cari kategori, catatan, nominal..." value="${esc(S.f.q)}">
      <select class="fld" id="fj"><option value="">Semua jenis</option><option>Pemasukan</option><option>Pengeluaran</option></select>
      <select class="fld" id="fk"><option value="">Semua kategori</option>${allCats.map(c => `<option>${esc(c)}</option>`).join('')}</select>
      <input type="date" class="fld" id="ff" aria-label="Dari tanggal" value="${S.f.from}">
      <input type="date" class="fld" id="ft" aria-label="Sampai tanggal" value="${S.f.to}">
    </div><div id="hl"></div>`;
    $('#fj').value = S.f.jenis; $('#fk').value = S.f.kat;
  }
  const list = filtered();
  if (!list.length) { $('#hl').innerHTML = S.data.length ? emptyHtml('Tidak ada hasil', 'Coba ubah kata kunci atau filter.') : emptyHtml('Belum ada transaksi', 'Ketuk "+ Tambah" untuk mulai mencatat.'); return; }
  const shown = list.slice(0, S.limit);
  $('#hl').innerHTML = shown.map(t => {
    const i = t.jenis === 'Pemasukan';
    return `<div class="tx"><div class="dot ${i ? 'i' : 'o'}">${i ? '+' : '-'}</div>
      <div class="m"><b>${esc(catKey(t.kategori))}</b><span>${fmtDate(t.tanggal)}${t.catatan ? ' - ' + esc(t.catatan) : ''}</span></div>
      <div class="a"><div class="${i ? 'in' : 'out'}">${i ? '+' : '-'}${rp(t.nominal)}</div>
      <div class="acts"><button data-edit="${t.id}">Edit</button><button class="del" data-del="${t.id}">Hapus</button></div></div></div>`;
  }).join('') + (list.length > S.limit ? `<button class="btn ghost more" id="more">Tampilkan lebih banyak (${list.length - S.limit})</button>` : '');
}

/* ---------- insight ---------- */
function renderIns() {
  const el = $('#v-ins');
  if (!S.loaded) { el.innerHTML = '<div class="sk" style="height:90px;margin-bottom:10px"></div>'.repeat(3); return; }
  const r = range(), pr = prevRange(r);
  const cur = inRange(S.data, r).filter(t => t.jenis === 'Pengeluaran');
  const prev = inRange(S.data, pr).filter(t => t.jenis === 'Pengeluaran');
  if (!cur.length && !prev.length) { el.innerHTML = emptyHtml('Belum ada data untuk dianalisis', 'Catat beberapa pengeluaran dulu, insight muncul otomatis.'); return; }
  const tot = cur.reduce((a, t) => a + t.nominal, 0), ptot = prev.reduce((a, t) => a + t.nominal, 0);
  const byCat = {};
  cur.forEach(t => { const k = catKey(t.kategori); byCat[k] = (byCat[k] || 0) + t.nominal; });
  const cats = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
  const avg = tot / elapsed(r);
  let cmp;
  if (!ptot) cmp = { e: '📊', h: 'Belum ada pembanding', p: 'Periode sebelumnya tidak punya pengeluaran.' };
  else {
    const pct = ((tot - ptot) / ptot) * 100, up = pct > 0;
    cmp = { e: up ? '📈' : '📉', h: `${up ? 'Naik' : 'Turun'} ${Math.abs(pct).toFixed(1).replace('.', ',')}%`, p: `${rp(tot)} dibanding ${rp(ptot)} pada ${fmtDate(pr[0])}${pr[0] === pr[1] ? '' : ' - ' + fmtDate(pr[1])}.` };
  }
  el.innerHTML = `
    <div class="card ins"><div class="e">🔥</div><div><h3>${cats.length ? `Paling boros: ${esc(cats[0][0])}` : 'Belum ada pengeluaran'}</h3><p>${cats.length ? `${rp(cats[0][1])} (${Math.round(cats[0][1] / tot * 100)}% dari total pengeluaran).` : 'Tidak ada pengeluaran di periode ini.'}</p></div></div>
    <div class="card ins"><div class="e">📅</div><div><h3>Rata-rata ${rp(avg)} per hari</h3><p>Dihitung dari ${elapsed(r)} hari yang sudah berjalan.</p></div></div>
    <div class="card ins"><div class="e">${cmp.e}</div><div><h3>${cmp.h} dari periode sebelumnya</h3><p>${cmp.p}</p></div></div>
    ${cats.length ? `<h2>Peringkat kategori</h2><div class="card">${cats.slice(0, 6).map(([k, v]) => `<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between"><span>${esc(k)}</span><b>${rp(v)}</b></div><div class="bar"><i style="width:${Math.max(3, v / cats[0][1] * 100)}%"></i></div></div>`).join('')}</div>` : ''}`;
}

/* ---------- form tambah/edit ---------- */
function fmtAmt(v) { const d = String(v).replace(/\D/g, '').replace(/^0+/, ''); return d ? Number(d).toLocaleString('id-ID') : ''; }

function renderChips() {
  const base = KAT[F.jenis];
  const list = F.kategori && !base.some(c => c.toLowerCase() === F.kategori.toLowerCase()) ? [...base, F.kategori] : base;
  $('#cats').innerHTML = list.map(c => `<button class="chip ${c.toLowerCase() === F.kategori.toLowerCase() ? 'on' : ''}" data-c="${esc(c)}">${esc(c)}</button>`).join('');
}
function renderSeg() { $$('#seg button').forEach(b => b.classList.toggle('on', b.dataset.j === F.jenis)); }

function openForm(t) {
  F = t ? { id: t.id, jenisLama: t.jenis, jenis: t.jenis, kategori: catKey(t.kategori), expected: { tanggal: t.tanggal, nominal: t.nominal, kategori: t.kategori } }
        : { id: null, jenis: 'Pengeluaran', kategori: '', expected: null };
  $('#formTtl').textContent = t ? 'Edit transaksi' : 'Tambah transaksi';
  $('#amt').value = t ? fmtAmt(t.nominal) : '';
  $('#dt').value = t ? t.tanggal : todayStr();
  $('#note').value = t ? t.catatan : '';
  ['#eAmt', '#eCat', '#eDt'].forEach(s => $(s).textContent = '');
  renderSeg(); renderChips();
  $('#formOv').hidden = false;
  document.body.style.overflow = 'hidden';
  setTimeout(() => $('#amt').focus(), 60);
}
function closeForm() { $('#formOv').hidden = true; document.body.style.overflow = ''; F = null; }

async function saveForm() {
  const nominal = parseInt($('#amt').value.replace(/\D/g, ''), 10);
  const tanggal = $('#dt').value;
  let bad = false;
  $('#eAmt').textContent = ''; $('#eCat').textContent = ''; $('#eDt').textContent = '';
  if (!nominal || nominal <= 0) { $('#eAmt').textContent = 'Nominal harus lebih dari 0.'; bad = true; }
  if (!F.kategori) { $('#eCat').textContent = 'Pilih satu kategori.'; bad = true; }
  if (!/^\d{4}-\d{2}-\d{2}$/.test(tanggal)) { $('#eDt').textContent = 'Tanggal wajib diisi.'; bad = true; }
  if (bad) return;
  const item = { jenis: F.jenis, tanggal, kategori: F.kategori, nominal, catatan: $('#note').value.trim() };
  $('#saveBtn').disabled = true; $('#saveBtn').textContent = 'Menyimpan...';
  const r = F.id ? await api('update', { id: F.id, jenisLama: F.jenisLama, expected: F.expected, item }) : await api('add', { item });
  $('#saveBtn').disabled = false; $('#saveBtn').textContent = 'Simpan';
  if (r.data) setData(r.data);
  if (r.ok) { toast(F.id ? 'Perubahan tersimpan' : 'Transaksi tersimpan'); closeForm(); }
  else if (!r.auth) { toast(r.error, false); if (r.stale) closeForm(); }
}

/* ---------- hapus ---------- */
function askDelete(t) {
  delItem = t;
  $('#delTxt').textContent = `${t.jenis} ${catKey(t.kategori)} sebesar ${rp(t.nominal)} pada ${fmtDate(t.tanggal)} akan dihapus dari Google Sheets.`;
  $('#delOv').hidden = false;
}
async function doDelete() {
  const t = delItem; if (!t) return;
  $('#delYes').disabled = true; $('#delYes').textContent = 'Menghapus...';
  const r = await api('delete', { id: t.id, jenis: t.jenis, expected: { tanggal: t.tanggal, nominal: t.nominal, kategori: t.kategori } });
  $('#delYes').disabled = false; $('#delYes').textContent = 'Hapus';
  $('#delOv').hidden = true; delItem = null;
  if (r.data) setData(r.data);
  if (r.ok) toast('Transaksi dihapus'); else if (!r.auth) toast(r.error, false);
}

/* ---------- event ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.nav) { S.view = t.dataset.nav; renderAll(); window.scrollTo(0, 0); }
  else if (t.dataset.p) { S.period = t.dataset.p; renderAll(); }
  else if (t.dataset.j && F) { F.jenis = t.dataset.j; F.kategori = ''; renderSeg(); renderChips(); }
  else if (t.dataset.c && F) { F.kategori = t.dataset.c; $('#eCat').textContent = ''; renderChips(); }
  else if (t.dataset.edit) { const x = S.data.find(d => d.id === t.dataset.edit); if (x) openForm(x); }
  else if (t.dataset.del) { const x = S.data.find(d => d.id === t.dataset.del); if (x) askDelete(x); }
  else if (t.id === 'more') { S.limit += 50; renderHist(); }
});
$('#pinBtn').onclick = doLogin;
$('#pin').addEventListener('keydown', e => e.key === 'Enter' && doLogin());
$('#addBtn').onclick = () => openForm(null);
$('#saveBtn').onclick = saveForm;
$('#cancelBtn').onclick = closeForm;
$('#formOv').addEventListener('click', e => { if (e.target.id === 'formOv') closeForm(); });
$('#delNo').onclick = () => { $('#delOv').hidden = true; delItem = null; };
$('#delYes').onclick = doDelete;
$('#refresh').onclick = () => load(true);
$('#logout').onclick = async () => { await api('logout'); localStorage.removeItem('cache'); S.data = []; S.loaded = false; showLogin(''); };
$('#amt').addEventListener('input', e => { e.target.value = fmtAmt(e.target.value); });
$('#cFrom').addEventListener('change', e => { S.cFrom = e.target.value; renderAll(); });
$('#cTo').addEventListener('change', e => { S.cTo = e.target.value; renderAll(); });
$('#v-hist').addEventListener('input', e => {
  const m = { fq: 'q', fj: 'jenis', fk: 'kat', ff: 'from', ft: 'to' }[e.target.id];
  if (!m) return;
  S.f[m] = e.target.value; S.limit = 50; renderHist();
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.token && !$('#app').hidden) load(); });

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
if (S.token) enterApp(); else showLogin('');
</script>
</body>
